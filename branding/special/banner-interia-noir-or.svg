<svg width="900" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="goldShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="900" height="220" fill="#000000"/>
  <rect x="40" y="70" width="820" height="80" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
        font-family="Didot, Times New Roman, serif" font-size="64"
        fill="url(#goldGrad)" filter="url(#goldShadow)">
      InterIA
  </text>
  <text x="50%" y="78%" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="22" fill="#FFD54F" opacity="0.9">
