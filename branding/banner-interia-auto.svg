<svg width="760" height="180" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d47a1; }
      .title { fill: white; }
      .sub { fill: #bbdefb; }
      .glow { stop-color: white; stop-opacity: 0.15; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #1976d2; }
      .title { fill: #0d47a1; }
      .sub { fill: #0d47a1; opacity: 0.8; }
      .glow { stop-color: white; stop-opacity: 0.25; }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop class="glow" offset="0%"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="760" height="180" class="bg"/>
  <rect width="760" height="180" fill="url(#glow)"/>
  <text x="50%" y="52%" text-anchor="middle" class="title"
        dominant-baseline="middle" font-family="Arial" font-size="60"
        font-weight="bold">Couret InterIA</text>
  <text x="50%" y="78%" text-anchor="middle" class="sub"
        dominant-baseline="middle" font-family="Georgia" font-size="26">
     Mathematics × AI × Open Science
  </text>
</svg>