<svg width="760" height="180" viewBox="0 0 760 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1976d2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="760" height="180" fill="url(#grad)"/>
  <rect width="760" height="180" fill="url(#glow)"/>
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle"
        font-family="Liberation Sans, Arial" font-size="60"
        fill="white" font-weight="bold" filter="url(#shadow)">
     InterIA
  </text>
  <text x="50%" y="78%" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia" font-size="26" fill="#e3f2fd" opacity="0.95">
     Mathematics × AI × Open Science
  </text>
</svg>